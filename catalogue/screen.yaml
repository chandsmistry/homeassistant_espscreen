# The screen's own cards: the clock, the bedside clock, the settings card and the tiles that go to a page. Nothing in
# Home Assistant stands behind them. docs/CATALOGUE.md says what every key means.
domain: screen
memory: {bytes: 32, extras: false}
# The energy card (firmware 0.47.0) keeps the house's moment (its devices and their sensors) and the diagram drawn from it,
# with a small picture of each running dot: its own price, measured as docs/TILE_MEMORY.md says.
cards:
  energy: {bytes: 6144, extras: true}
  # Native PD data, selector options and persistent draw canvas; a conservative bounded allowance.
  pd_header: {bytes: 8192, extras: true}
  pd_dp3: {bytes: 8192, extras: true}
  pd_ultra: {bytes: 8192, extras: true}
  pd_ac: {bytes: 8192, extras: true}
  pd_max: {bytes: 8192, extras: true}
  pd_batteries: {bytes: 12288, extras: true}
# How the energy card shows power along a line: running dots (power-flow-card-plus's, the default), or calm lines that
# grow with the power and carry an arrow the way it goes. A firmware before this one keeps the dots.
energy:
  flow: [dots, lines]
firmware: 0.2.14   # the first firmware that draws these cards
displays:
  # The clock's faces; the dial and the flip clock came with firmware 0.3.6.
  digital: {}
  analog: {}
  dial:
    screen: {firmware: 0.3.6, else: digital}
  flip:
    screen: {firmware: 0.3.6, else: digital}
key: false

# PD cards share a configurable device action. This opens a selector; choosing a
# row sends that selector's HA select_option action. The legacy target is migration
# data only, so existing layouts keep the action the user already configured.
pd:
  entities: [screen.pd_header, screen.pd_dp3, screen.pd_ultra, screen.pd_ac, screen.pd_max, screen.pd_batteries]
  taps: [action, none]
  action: screen.open_selector
  action_name: Open selector
  action_description: Open a selector on the panel and choose its value.
  entity_field: entity
  selector_domains: [input_select, select]
  legacy_target: input_select.pd_control_mode
  selector_feature: pd_selector
  native_feature: pd_native
  actions_feature: pd_actions
  actions_option: pd_actions
  blocks: [header, dp3, ultra, ac, max]
  block_names: [PD header, Delta Pro 3, Stream Ultra X, Stream AC, Stream MAX]
  entity_blocks:
    screen.pd_header: [header]
    screen.pd_dp3: [dp3]
    screen.pd_ultra: [ultra]
    screen.pd_ac: [ac]
    screen.pd_max: [max]
    screen.pd_batteries: [dp3, ultra, ac, max]
